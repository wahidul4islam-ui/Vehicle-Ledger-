# Path in your repo: .github/workflows/build-apk.yml
name: Build APK from zip

on:
  push:
    paths:
      - '*.zip'            # runs when you upload a new zip to the repo root
  workflow_dispatch:       # or run manually from the Actions tab

env:
  APP_NAME: Vehicle Ledger
  APP_ID: com.vehicleledger.app   # keep the same id on every build so updates install over the old app and keep data

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip the project (latest zip in repo root)
        run: |
          ZIP=$(ls *.zip | sort -V | tail -1)
          echo "Using $ZIP"
          mkdir app_src && unzip -q "$ZIP" -d app_src
          WEB=$(dirname "$(find app_src -path '*assets/public/index.html' | head -1)")
          ICONS=$(dirname "$(find app_src -type d -name 'mipmap-hdpi' | head -1)")
          echo "WEB=$WEB"     >> $GITHUB_ENV
          echo "ICONS=$ICONS" >> $GITHUB_ENV

      - name: Create Capacitor Android project
        run: |
          mkdir -p www && cp -r "$WEB"/. www/
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "$APP_NAME" "$APP_ID" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Apply launcher icons
        run: |
          RES=android/app/src/main/res
          # remove adaptive/default icons so our PNG icons are used
          rm -rf $RES/mipmap-anydpi-v26 $RES/drawable-v24/ic_launcher_foreground.xml $RES/drawable/ic_launcher_background.xml
          rm -f $RES/mipmap-*/ic_launcher*.png
          cp -r "$ICONS"/mipmap-* $RES/

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vehicle-Ledger-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
